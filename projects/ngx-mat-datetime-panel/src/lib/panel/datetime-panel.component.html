<ng-template>
  <div class="ngx-mat-datetime-panel">
    <ngx-mat-datetime-panel-content
      [selected]="selected"
      [startAt]="startAt ?? selected"
      [startView]="startView"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [dateFilter]="dateFilter"
      [dateClass]="dateClass"
      [granularity]="granularity"
      [showSeconds]="showSeconds"
      [timeStep]="timeStep"
      [disabled]="disabled"
      (selectedChange)="onContentSelected($event)"
    />

    @if (showActionButtons) {
      <div class="ngx-mat-datetime-panel__actions">
        <button type="button" class="ngx-mat-datetime-panel__action" (click)="selectNow()">Ahora</button>
        <button type="button" class="ngx-mat-datetime-panel__action ngx-mat-datetime-panel__action--primary" (click)="close()">
          Aceptar
        </button>
      </div>
    }
  </div>
</ng-template>
